<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="authStyles.css">
</head>
<body>
<main>
    <div class="container">
        <div class="logo">
            <span>Alkywall</span>
        </div>
    </div>
    <div class="hero-info m-t-50">
        <h1>Iniciar Sesión</h1>
    </div>
    <form id="loginForm" action="">
        <label for="email">Email:</label>
        <input type="text" id="email" name="email" placeholder="correo@gmail.com">
        <div id="emailError" class="error">Email Inválido</div>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="********">
        <div id="passwordError" class="error">La contraseña debe tener al menos 8 caracteres.</div>

        <div id="serverError" class="error"></div>

        <button type="submit" class="btn btn-primario" id="btn-login">Iniciar Sesión</button>
        <a class="btn-register" href="registro.html"><i>o Registrarse</i></a>
    </form>
</main>
<script src="validacionesLogin.js"></script>
</body>
</html>
