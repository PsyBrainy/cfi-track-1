<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada — Alkywall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="404.css">
</head>
<body>
<div class="container">
    <div class="logo m-t-50">
        <a href="index.html">
            <span>Alkywall</span>
        </a>
    </div>
</div>

<main>
    <div class="wrap">
        <div class="copy">
            <p class="eyebrow-code">404</p>
            <h1>No encontramos esta página</h1>
            <p class="subtext">El enlace puede estar roto o la página cambió de lugar. Revisá la dirección o volvé a un sitio conocido.</p>
            <div class="actions">
                <a class="btn btn-primario" href="index.html">Volver al Inicio</a>
            </div>
        </div>

        <div class="card">
            <p class="card-label">Estado de la página</p>
            <p class="amount">No hallada</p>

            <div class="card-row">
                <span class="label">Código de error</span>
                <span class="value negative">404</span>
            </div>
            <div class="card-row">
                <span class="label">Sugerencia</span>
                <span class="value positive">Ir al inicio</span>
            </div>
        </div>
    </div>
</main>
</body>
</html>
