<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Alkywall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="reportes/reporte.module.css">
    <link rel="stylesheet" href="deposito/deposito.module.css">
    <link rel="stylesheet" href="shared/toast.css">
</head>
<body>
<header class="dashboard-header">
    <span class="dashboard-logo">Alkywall</span>
    <button type="button" class="dashboard-logout" id="btn-logout">Cerrar sesión</button>
</header>
<main class="dashboard-container">
    <section class="balance-card">
        <p>Tu saldo actual</p>
        <!-- Contenedor especifico para el saldo -->
        <h2 id="saldo-disponible">Cargando...</h2>
        <div class="dashboard-acciones">
            <a href="transferencias/transferencia.html" class="dashboard-accion">💸 Enviar dinero</a>
            <a href="movimientos/historial.html" class="dashboard-accion">📋 Ver movimientos</a>
            <a href="admin/usuarios.html" class="dashboard-accion">👥 Administrar usuarios</a>
        </div>
    </section>

    <div class="dashboard-grid">
        <!-- Componente aislado: Depositar Dinero -->
        <section class="deposito-container">
            <h2 class="deposito-titulo">💰 Depositar dinero</h2>
            <p class="deposito-subtitulo">Cargá saldo a tu cuenta Alkywall.</p>

            <div class="deposito-campo">
                <label for="deposito-monto">Monto a depositar</label>
                <input type="number" id="deposito-monto" name="monto" placeholder="0.00" min="1" step="0.01">
                <span class="deposito-error" id="deposito-error"></span>
            </div>

            <div class="deposito-notificacion" id="deposito-notificacion"></div>

            <button type="button" class="deposito-boton" id="btn-confirmar-deposito" disabled>Confirmar Depósito</button>
        </section>

        <!-- Componente aislado: Reporte de Gastos -->
        <section class="reporte-container">
            <h2 class="reporte-titulo">📊 Reporte de gastos</h2>
            <p class="reporte-mensaje" id="reporte-mensaje"></p>
            <div class="reporte-barras" id="reporte-barras"></div>
        </section>
    </div>
</main>
<script src="shared/toast.js"></script>
<script src="dashboard.js"></script>
<script src="reportes/reporte.js"></script>
<script src="deposito/deposito.js"></script>
</body>
</html>
